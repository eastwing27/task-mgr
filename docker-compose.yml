version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Development mode with Node.js)
  backend:
    image: node:20
    working_dir: /app
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://taskuser:taskpass@postgres:5432/taskmanager
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./be:/app
      - be_node_modules:/app/node_modules
      - be_generated:/app/generated
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm start"
    restart: unless-stopped

  # Frontend Service (Development mode with Node.js)
  frontend:
    image: node:20
    working_dir: /app
    environment:
      API_URL: http://localhost:3000/api/v1
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
      - fe_nuxt:/app/.nuxt
    command: sh -c "apt-get update && apt-get install -y python3 make g++ && npm install --force && npm rebuild && npm run dev"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  be_node_modules:
  be_generated:
  fe_node_modules:
  fe_nuxt: